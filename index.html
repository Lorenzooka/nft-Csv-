<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Star NFT – Image & CSV Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>All Star NFT – Image & CSV Simulator</h1>
  </header>
  <div class="wrapper">
    <!-- Control panel -->
    <div class="controls">
      <label>
        Base image:
        <input type="file" id="upload" accept="image/png, image/jpeg" />
      </label>
      <label>
        Scale: <input type="range" id="scale" min="70" max="75" step="0.5" value="73" />
        <span id="scaleVal">73%</span>
      </label>
      <label>
        Vertical offset:
        <input type="range" id="offsetY" min="-200" max="200" step="5" value="0" />
        <span id="offsetYVal">0</span>
      </label>
      <label>
        Outline: <input type="checkbox" id="outline" />
      </label>
      <fieldset>
        <legend>Background</legend>
        <div>
          <label><input type="radio" name="bgType" value="solid" checked /> Solid</label>
          <input type="color" id="bgColor1" value="#0b0c10" />
        </div>
        <div>
          <label><input type="radio" name="bgType" value="gradient" /> Gradient</label>
          <input type="color" id="bgColor2" value="#14233a" />
          <label>Angle:
            <input type="number" id="bgAngle" value="45" min="0" max="360" />
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Aura</legend>
        <label>
          Type:
          <select id="auraType">
            <option value="none">None</option>
            <option value="glow">Glow</option>
            <option value="starry">Starry</option>
            <option value="swirl">Swirl</option>
            <option value="multicolor">Multicolor</option>
          </select>
        </label>
        <label>
          Color: <input type="color" id="auraColor" value="#3a66ff" />
        </label>
        <label>
          Strength:
          <input type="range" id="auraStrength" min="0" max="1" step="0.1" value="0.5" />
          <span id="auraStrengthVal">0.5</span>
        </label>
      </fieldset>
      <fieldset>
        <legend>Chest Crystal</legend>
        <label>
          Shape:
          <select id="crystalShape">
            <option value="none">None</option>
            <option value="diamond">Diamond</option>
            <option value="star">Star</option>
            <option value="circle">Circle</option>
            <option value="triangle">Triangle</option>
            <option value="hexagon">Hexagon</option>
            <option value="lightning">Lightning</option>
            <option value="spiral">Spiral</option>
          </select>
        </label>
        <label>
          Color: <input type="color" id="crystalColor" value="#ffffff" />
        </label>
        <label>
          Size:
          <input type="range" id="crystalSize" min="20" max="200" step="5" value="80" />
          <span id="crystalSizeVal">80</span>
        </label>
        <label>
          Brightness:
          <input type="range" id="crystalBrightness" min="0" max="1" step="0.05" value="0.8" />
          <span id="crystalBrightnessVal">0.8</span>
        </label>
        <button type="button" id="autoChest">Auto chest</button>
      </fieldset>
      <fieldset>
        <legend>Traits</legend>
        <label>
          Outfit color:
          <select id="outfitColor">
            <option value="gold">Gold</option>
            <option value="silver">Silver</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
          </select>
        </label>
        <label>
          Rarity:
          <select id="rarityTier">
            <option value="Common">Common</option>
            <option value="Rare">Rare</option>
            <option value="Legendary">Legendary</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Metadata</legend>
        <label>
          Name template:
          <input type="text" id="nameTemplate" value="All Star Penguin #{{id}}" />
        </label>
        <label>
          Description:
          <textarea id="descriptionTemplate" rows="3">A unique All Star Penguin NFT.</textarea>
        </label>
        <label>
          External URL:
          <input type="text" id="externalUrl" placeholder="https://" />
        </label>
      </fieldset>
      <button type="button" id="randomize">Randomize</button>
      <button type="button" id="exportBtn">📦 Export PNG + Add to CSV</button>
      <button type="button" id="downloadCsvBtn">📄 Download CSV</button>
    </div>
    <!-- Preview area -->
    <div class="preview">
      <canvas id="canvas" width="1024" height="1024"></canvas>
    </div>
  </div>
  <!-- CSV table listing -->
  <div class="csv-list">
    <table id="csvTable">
      <thead>
        <tr>
          <th>tokenID</th>
          <th>name</th>
          <th>description</th>
          <th>file_name</th>
          <th>external_url</th>
          <th>Outfit Color</th>
          <th>Aura</th>
          <th>Crystal</th>
          <th>Rarity</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
